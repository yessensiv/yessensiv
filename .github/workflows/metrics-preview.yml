name: Metrics preview
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/metrics-preview.yml
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Render public profile
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: yessensiv
          output_action: none
          filename: metrics-profile.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Qyzylorda
          config_animations: yes
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_activity: yes
          plugin_activity_limit: 5
          extras_css: |
            svg { --color-text: #c9d1d9; --color-text-accent: #a7f3d0; --color-background: #0d1519; }
      - name: Save rendered preview
        uses: actions/upload-artifact@v4
        with:
          name: metrics-preview
          path: /metrics_renders/*.svg
          if-no-files-found: error
