name: Contribution snake
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/profile-snake.yml
permissions:
  contents: write
concurrency:
  group: profile-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: yessensiv
          outputs: |
            assets/snake.svg?color_snake=#34d399&color_dots=#ebedf0,#d1fae5,#6ee7b7,#34d399,#059669
            assets/snake-dark.svg?palette=github-dark&color_snake=#a7f3d0&color_dots=#161b22,#164e3a,#247957,#34b580,#a7f3d0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save generated animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake*.svg
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update contribution snake"
          git pull --rebase origin main
          git push origin HEAD:main
